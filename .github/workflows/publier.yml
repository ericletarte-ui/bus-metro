# Télécharge les horaires de la STM, prépare les données de l'app et publie le site sur GitHub Pages.
# Roule à chaque changement sur main, et chaque nuit pour garder les horaires à jour.
name: Publier l'app

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"   # vers 3 h 17, heure de Montréal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger le GTFS de la STM
        run: |
          curl -fsSL --retry 4 --retry-delay 10 -o gtfs_stm.zip https://www.stm.info/sites/default/files/gtfs/gtfs_stm.zip \
            || curl -fsSL --retry 4 -o gtfs_stm.zip https://storage.googleapis.com/mdb-latest/ca-quebec-societe-de-transport-de-montreal-stm-gtfs-2126.zip
          ls -la gtfs_stm.zip
      - name: Préparer les données
        run: |
          python3 outils/verifier.py gtfs_stm.zip | grep -v "^  "
          python3 outils/construire_donnees.py gtfs_stm.zip site/donnees 14
      - name: Horaires du RTC (Québec)
        # Si le RTC est indisponible, on publie quand même Montréal.
        continue-on-error: true
        run: |
          curl -fsSL --retry 4 --retry-delay 10 -o gtfs_rtc.zip https://cdn.rtcquebec.ca/Site_Internet/DonneesOuvertes/googletransit.zip
          ls -la gtfs_rtc.zip
          curl -sSI https://cdn.rtcquebec.ca/Site_Internet/DonneesOuvertes/googletransit.zip | grep -i -E "last-modified|content-length" || true
          python3 outils/verifier.py gtfs_rtc.zip 3484 5173
          python3 outils/construire_donnees.py gtfs_rtc.zip site/donnees/rtc 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
